<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Staggered List Micro-interaction</title>
  <style>
    body {
      background-color: #f8fafc;
      font-family: -apple-system, system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .list-container {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border-radius: 1.5rem;
      box-shadow: 0 20px 40px -15px rgba(0,0,0,0.1);
      padding: 1.5rem;
    }

    .list-item {
      padding: 1rem;
      border-radius: 1rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      cursor: pointer;
      background: transparent;
      transition: background-color 0.2s ease, transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .list-item:hover {
      background: #f1f5f9;
      transform: translateX(8px);
    }

    .list-item:active {
      transform: translateX(4px) scale(0.98);
    }

    .avatar {
      width: 3rem;
      height: 3rem;
      border-radius: 50%;
      background: linear-gradient(135deg, #e2e8f0, #cbd5e1);
    }

    .info {
      display: flex;
      flex-direction: column;
    }

    .name {
      font-weight: 600;
      color: #0f172a;
    }

    .status {
      font-size: 0.875rem;
      color: #64748b;
    }

  </style>
</head>
<body>
  <div class="list-container">
    <div class="list-item">
      <div class="avatar"></div>
      <div class="info">
        <span class="name">Alice Freeman</span>
        <span class="status">Online</span>
      </div>
    </div>
    <div class="list-item">
      <div class="avatar"></div>
      <div class="info">
        <span class="name">Bob Smith</span>
        <span class="status">In a meeting</span>
      </div>
    </div>
    <div class="list-item">
      <div class="avatar"></div>
      <div class="info">
        <span class="name">Charlie Davis</span>
        <span class="status">Away</span>
      </div>
    </div>
  </div>
</body>
</html>
